name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradlew is committed, so install the Gradle version pinned in the wrapper properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Lint, unit tests and debug build
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/
